# Enable AndroidX (Required by Compose & Navigation)
android.useAndroidX=true

# Keep aarch64 PRoot AAPT2 override
android.aapt2FromMavenOverride=/usr/local/bin/aapt2

# Ignore iOS compilation while building on Linux/Android host
kotlin.native.ignoreDisabledTargets=true

# Memory settings for PRoot
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# PRoot virtual filesystem compatibility
kotlin.incremental=false
